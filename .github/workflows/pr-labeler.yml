name: PR Labeler

on:
  # Safe: labeler only reads the changed file list via the API; it never checks out PR code.
  pull_request_target: # zizmor: ignore[dangerous-triggers]

permissions: {}

jobs:
  labeler:
    name: Label PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
          dot: true
