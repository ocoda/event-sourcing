name: Release

on:
  push:
    branches:
      - 3.x

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  changelog:
    name: Release
    runs-on: ubuntu-latest
    # Repository writes (version branch, PR, tags, GitHub releases) use the GitHub App token below.
    permissions:
      contents: read # GITHUB_TOKEN only reads
      id-token: write # npm trusted publishing (OIDC)
    steps:
      # A GitHub App token lets changesets/action open the version PR (Actions may not create PRs in this
      # repository), and its pushes and PR trigger CI, which events made with GITHUB_TOKEN never do.
      - name: Create a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The action sends this value as the JWT issuer, which may be the App ID or the Client ID.
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-pull-requests: write

      # changesets/action v1 pushes the release branch and tags with the checkout credentials,
      # so the checkout must persist the App token.
      - name: Checkout the repository # zizmor: ignore[artipacked]
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.4.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build --filter="./packages/**"

      - name: Guard - 3.x only ships 3.x patch releases
        run: |
          pnpm exec changeset status --output=changeset-status.json || true
          if [ -f changeset-status.json ]; then
            # Only packages that are actually released are checked; private packages have type "none"
            # and no newVersion. Any jq error fails the step instead of silently passing the guard.
            jq -r '.releases[] | select(.type != "none") | "\(.name) \(.type) \(.newVersion)"' changeset-status.json
            not_patch=$(jq '[.releases[] | select(.type != "none" and .type != "patch")] | length' changeset-status.json)
            not_3x=$(jq '[.releases[] | select(.type != "none") | select((.newVersion // "") | startswith("3.") | not)] | length' changeset-status.json)
            if [ "$not_patch" -ne 0 ]; then
              echo "::error::The 3.x maintenance line only accepts patch changesets."
              exit 1
            fi
            if [ "$not_3x" -ne 0 ]; then
              echo "::error::3.x releases must stay on the 3.x major."
              exit 1
            fi
            rm -f changeset-status.json
          fi

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm exec changeset version
          publish: pnpm exec changeset publish
          commit: "[ci] release"
          title: "[ci] release"
        env:
          # Used for the PR and GitHub release API calls, and by @changesets/changelog-github during `changeset version`.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
