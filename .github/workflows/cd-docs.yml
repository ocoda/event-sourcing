name: CD Docs

# Publishes one GitHub Pages site: the 4.x docs (Starlight, docs/ on master) at https://ocoda.github.io/event-sourcing/
# and the 3.x docs (Nextra, docs/ on the 3.x branch) under /v3/. Each links to the other.
#
# Deployment is manual: dispatch this workflow on master. A dispatch on another branch, or with `deploy` off, and a pull
# request that changes this workflow or its script, build and check the site without deploying it.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the site to GitHub Pages (only from master)
        type: boolean
        default: true
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/cd-docs.yml
      - .github/scripts/docs-site.sh

permissions: {}

concurrency:
  group: cd-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-v4:
    name: Build the 4.x docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup job environment
        uses: ./.github/actions/setup-job-env
        with:
          node-version: 24.x

      - name: Build
        run: pnpm docs:build --filter=@ocoda/event-sourcing-docs

      - name: Upload the build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-v4
          path: docs/dist
          if-no-files-found: error
          retention-days: 1

  build-v3:
    name: Build the 3.x docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository and its 3.x branch
    steps:
      # Only the script: the 3.x docs are built from the 3.x branch, with its own lockfile and pnpm version.
      - name: Checkout the build script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/docs-site.sh
          sparse-checkout-cone-mode: false

      - name: Checkout the 3.x branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3.x
          path: v3
          persist-credentials: false

      - name: Install pnpm (the version of 3.x)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: v3/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Install the docs dependencies
        working-directory: v3
        run: pnpm install --frozen-lockfile --filter "@ocoda/event-sourcing-docs..."

      - name: Serve the 3.x docs under /v3/
        run: bash .github/scripts/docs-site.sh patch-v3 v3/docs

      # `next build` directly: the package script's next-sitemap step writes a sitemap for the root of the site.
      - name: Build
        working-directory: v3/docs
        run: pnpm exec next build
        env:
          GITHUB_PAGES: true

      - name: Remove the files that belong to the root of the site
        run: bash .github/scripts/docs-site.sh clean-v3 v3/docs/dist

      - name: Upload the build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-v3
          path: v3/docs/dist
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble and check the site
    needs: [build-v4, build-v3]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the check script
    steps:
      - name: Checkout the check script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/docs-site.sh
          sparse-checkout-cone-mode: false

      - name: Download the 4.x docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-v4
          path: site

      - name: Download the 3.x docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-v3
          path: site/v3

      - name: Check the links and assets
        run: bash .github/scripts/docs-site.sh check site

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: assemble
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One deployment at a time, and never cancel one that runs.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # verify the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
