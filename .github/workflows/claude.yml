name: Claude

# @claude in an issue, an issue or PR comment, a PR review or a PR review comment. Only the maintainers can summon
# Claude: the author of the text that mentions @claude must be an owner, member or collaborator. The action checks
# on top of that that the triggering actor has write access.
# Claude answers in a comment. It commits through the GitHub API, never with the git CLI: from an issue to a new
# claude/* branch, and on a pull request to that pull request's own branch. It never opens, approves or merges a pull
# request; from an issue, a maintainer opens the PR from the link Claude leaves. See CONTRIBUTING.md "Maintenance
# automation".
# Pull requests from forks are refused. The action checks a fork's branch out under the fork's branch name, so
# Claude's commit would land on the branch of that name in this repository (a release or Renovate branch, say), and
# the fork's code would become a branch of this repository.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions: {}

jobs:
  claude:
    name: Claude
    if: >-
      (
        github.event_name == 'issue_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        && github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        github.event_name == 'pull_request_review'
        && contains(github.event.review.body, '@claude')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)
        && github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        github.event_name == 'issues'
        && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read # check out the repository; Claude's own writes use the Claude GitHub App token
      actions: read # CI status and job logs on pull requests (the action's github_ci tools)
      pull-requests: read # the fork check below
      id-token: write # exchanged for the Claude GitHub App token
    env:
      # Keep the Claude token and the Actions runtime tokens out of the commands Claude runs.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      # A comment event doesn't say where the pull request's branch lives, so ask. Review events are filtered in `if:`.
      - name: Refuse pull requests from forks
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          cross=$(gh pr view "$PR_NUMBER" --json isCrossRepository --jq .isCrossRepository)
          if [ "$cross" != "false" ]; then
            echo "::error::@claude does not run on pull requests from forks: its commit would land on the branch of the same name in this repository."
            exit 1
          fi

      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude
        uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Setting this makes the action request an explicit permission set for the Claude App token: its defaults
          # (contents, pull_requests and issues: write) plus actions: read. Without it the token would carry every
          # permission the App holds, including workflows and repository_hooks, so a prompt-injected run could push
          # a workflow file that reads the repository secrets.
          additional_permissions: |
            actions: read
          # Commits go through the GitHub API (the action's commit_files tool) instead of git add/commit/push, so
          # Claude has no git command that writes. It can't read a file such as /proc/self/environ into a commit
          # message (`git commit -F`), run a git hook, or push a branch other than its own. The App signs the commits.
          use_commit_signing: "true"
          # Not a permission grant: the owner has write access anyway, and with the Claude App token the action ignores
          # this list in its write check. Any value switches the action to a git credential helper, so the App token is
          # never written into .git/config, where read-only commands such as `git remote -v` or `grep -r` would show
          # it. It also runs the commands Claude starts in their own PID namespace.
          allowed_non_write_users: drieshooghe
          settings: |
            {"permissions": {"blockReadsOutsideWorkingDirectories": true}}
          # Claude gets the action's own tools (read the checkout, commit_files, its tracking comment, CI status) and
          # the read-only commands Claude Code allows by itself (git log/diff/show, gh issue/pr view, gh search, ...),
          # each with a fixed set of flags. No extra Bash rules: `Bash(gh issue view:*)` would allow any flag and host.
          # The App token is in the environment of Claude's commands, because gh needs it. The deny rules back up the
          # built-in limits: nothing may print the environment (`gh --jq '$ENV'`, jq), read the git config, or talk
          # to a host of Claude's choosing.
          # No npm, npx or pnpm: on a pull request the checkout is the PR's code, and its .npmrc could expand $GH_TOKEN
          # into a registry URL.
          claude_args: |
            --max-turns 60
            --disallowedTools "Bash(gh pr merge:*),Bash(gh pr review:*),Bash(gh api:*),Bash(gh workflow:*),Bash(gh release create:*),Bash(gh release edit:*),Bash(gh secret:*),Bash(gh * --hostname*),Bash(gh * --jq*),Bash(gh * -q*),Bash(gh * --template*),Bash(gh * -t*),Bash(gh * *://*),Bash(gh * -R*/*/*),Bash(gh * --repo*/*/*),Bash(jq:*),Bash(git remote:*),Bash(git config:*),Bash(npm:*),Bash(npx:*),Bash(pnpm:*),Read(./.git/**),Read(//proc/**),Skill(release)"
