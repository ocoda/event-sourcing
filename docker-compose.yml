          "mongosh",
          "--port",
          "27018",
          "--quiet",
          "--eval",
          "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27018' }] }) } quit(db.runCommand({ hello: 1 }).isWritablePrimary ? 0 : 1)",
