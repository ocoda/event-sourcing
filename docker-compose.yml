services:
  mongodb:
    container_name: es-mongodb
    image: mongo:8
    ports:
      - 27017:27017
    volumes:
      - type: tmpfs
        target: /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 6

  mongodb-6:
    container_name: es-mongodb-6
    image: mongo:6
    ports:
      - 27017:27017
    volumes:
      - type: tmpfs
        target: /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 6

  mongodb-7:
    container_name: es-mongodb-7
    image: mongo:7
    ports:
      - 27017:27017
    volumes:
      - type: tmpfs
        target: /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 6

  mongodb-8:
    container_name: es-mongodb-8
    image: mongo:8
    ports:
      - 27017:27017
    volumes:
      - type: tmpfs
        target: /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Single-member replica sets on 27018, next to the standalone servers on 27017: the MongoDB unit, resilience and
  # conformance specs also run on the replica set when ES_TEST_MONGODB_RS_URL=mongodb://localhost:27018/?replicaSet=rs0
  # is set (e2e stays on the standalone server). The member advertises localhost:27018, so clients on the host reach
  # it through the published port. The first health check initiates the replica set, and the service is healthy once
  # the member is a writable primary.
  mongodb-6-rs:
    container_name: es-mongodb-6-rs
    image: mongo:6
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - 27018:27018
    volumes:
      - type: tmpfs
        target: /data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--port",
          "27018",
          "--quiet",
          "--eval",
          "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27018' }] }) } quit(db.runCommand({ hello: 1 }).isWritablePrimary ? 0 : 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  mongodb-7-rs:
    container_name: es-mongodb-7-rs
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - 27018:27018
    volumes:
      - type: tmpfs
        target: /data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--port",
          "27018",
          "--quiet",
          "--eval",
          "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27018' }] }) } quit(db.runCommand({ hello: 1 }).isWritablePrimary ? 0 : 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  mongodb-8-rs:
    container_name: es-mongodb-8-rs
    image: mongo:8
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - 27018:27018
    volumes:
      - type: tmpfs
        target: /data/db
    healthcheck:
      test:
        [
